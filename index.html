  <main class="shell">
    <header class="topbar">

    <section class="workspace" aria-label="粤语转普通话工作区">
      <div class="pane">
        <div class="pane-head"><div class="lang">粤语 <span class="tag">广东话</span></div><button class="mini" id="clearBtn" type="button">清空</button></div>
        <textarea id="source" aria-label="粤语输入" placeholder="输入粤语，或者按下麦克风开始讲…" spellcheck="false"></textarea>
        <div class="divider"></div>
        <div class="controls">
          <button class="mic" id="micBtn" type="button"><span>●</span><span id="micLabel">开始说粤语</span></button>
          <div class="wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
          <button class="primary" id="translateBtn" type="button">立即翻译</button>
        </div>
        <div class="opts"><label class="check"><input id="continuous" type="checkbox" checked> 连续聆听</label><label class="check"><input id="autoSpeak" type="checkbox" checked> 自动朗读结果</label><span id="queueState">逐句排队：空闲</span></div>
      </div>
      <div class="pane">
        <div class="pane-head"><div class="lang">普通话 <span class="tag">简体中文</span></div><button class="mini" id="copyBtn" type="button">复制</button></div>
        <div id="result" class="result empty" aria-live="polite">翻译结果会实时显示在这里</div>
        <div class="divider"></div>
        <div class="controls">
          <button class="primary" id="speakBtn" type="button">▶ 朗读普通话</button>
          <button class="iconbtn" id="stopSpeakBtn" type="button" title="停止朗读" aria-label="停止朗读">■</button>
        </div>
        <div class="examples">
          <div class="examples-title">试试这些粤语</div>
          <div class="chips"><button class="chip">唔该，呢度点去地铁站？</button><button class="chip">我哋听日再倾啦</button><button class="chip">佢而家返紧工</button></div>
        </div>
        <div class="note"><b>提示</b><span>本工具使用浏览器自带语音识别，不需要 API 充值。手机请优先使用 Chrome 或 Edge，并允许麦克风权限；当前内置浏览器不支持时，请复制网址到手机浏览器打开。</span></div>
      </div>
    </section>
  </main>
  <div class="mobile-dock" aria-label="手机快捷控制">
    <button class="mic" id="mobileMicBtn" type="button"><span>●</span><span id="mobileMicLabel">开始说粤语</span></button>
    <button class="iconbtn" id="mobileStopBtn" type="button" aria-label="停止朗读">■</button>
  </div>
  <div class="toast" id="toast" role="status"></div>

      recognition.onaudiostart=()=>{supportText.textContent='麦克风已连接';statusText.textContent='正在听粤语…'};
      recognition.onspeechstart=()=>{statusText.textContent='正在识别粤语';restartCount=0;lastRecognitionError=''};
      recognition.onresult=e=>{restartCount=0;lastRecognitionError='';let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript.trim();if(e.results[i].isFinal)pendingFinal+=(pendingFinal?' ':'')+t;else interim+=(interim?' ':'')+t}commitSentence(false);const shown=[...committedSource,pendingFinal,interim].filter(Boolean).join('\n');source.value=shown;render([...committedResult,pendingFinal?translate(pendingFinal):''].filter(Boolean).join('\n'),interim);clearTimeout(commitTimer);if(pendingFinal)commitTimer=setTimeout(()=>commitSentence(firstSpeechTriggered),850)};
      recognition.onerror=e=>{starting=false;lastRecognitionError=e.error;if(e.error==='aborted'&&manualStop)return;if(e.error==='no-speech'&&listening&&!manualStop){statusText.textContent='还没听到声音，继续聆听…';return}if(e.error==='network'&&listening&&!manualStop&&restartCount<5){restartCount++;statusText.textContent=`语音服务重连中（${restartCount}/5）…`;supportText.textContent='浏览器语音服务暂时断开';return}manualStop=true;clearTimeout(restartTimer);setListening(false);supportText.textContent='浏览器语音识别不可用';toast(recognitionMessages[e.error]||`语音识别失败：${e.error}`)};
      recognition.onend=()=>{starting=false;commitSentence(firstSpeechTriggered||manualStop);scheduleRestart()};
    }else{supportText.textContent='此浏览器不支持语音识别';[micBtn,mobileMicBtn].forEach(b=>b.classList.add('unsupported'))}
    async function toggleListening(){if(!recognition){toast('请复制网址到手机 Chrome 或 Edge 打开');return}if(listening){manualStop=true;listening=false;starting=false;clearTimeout(restartTimer);try{recognition.stop()}catch(_){}setListening(false);return}if(!await ensureMicPermission())return;const existing=source.value.trim();committedSource=existing?[existing]:[];committedResult=existing?[translate(existing)]:[];pendingFinal='';firstSpeechTriggered=false;manualStop=false;restartCount=0;lastRecognitionError='';setListening(true);safeRecognitionStart()}micBtn.onclick=toggleListening;mobileMicBtn.onclick=toggleListening;
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&listening&&!manualStop)scheduleRestart()});
    let debounce;source.addEventListener('input',()=>{finalText=source.value;committedSource=finalText?[finalText]:[];committedResult=finalText?[translate(finalText)]:[];clearTimeout(debounce);debounce=setTimeout(()=>render(source.value),180)});
    function stopSpeech(){speechQueue=[];speaking=false;speechSynthesis.cancel();updateQueue();toast('已停止并清空朗读队列')}$('#translateBtn').onclick=()=>{const t=render(source.value);if(t&&$('#autoSpeak').checked)enqueueSpeech(t)};$('#speakBtn').onclick=()=>speak();$('#stopSpeakBtn').onclick=stopSpeech;$('#mobileStopBtn').onclick=stopSpeech;
    $('#clearBtn').onclick=()=>{source.value='';finalText='';pendingFinal='';firstSpeechTriggered=false;committedSource=[];committedResult=[];speechQueue=[];speaking=false;render('');speechSynthesis.cancel();updateQueue();source.focus()};
    $('#copyBtn').onclick=async()=>{const t=translate(source.value);if(!t)return toast('暂无可复制内容');try{await navigator.clipboard.writeText(t);toast('已复制普通话译文')}catch(_){toast('复制失败，请手动选择')}};
    document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{source.value=b.textContent;finalText=source.value;committedSource=[finalText];committedResult=[translate(finalText)];render(source.value)});updateQueue();
  </script>
</body>
</html>
