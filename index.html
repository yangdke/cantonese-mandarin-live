  <main class="shell">
    <header class="hero">
      <div class="logo-wrap"><img src="logo.png" alt="入港通 Logo"></div>
      <div><span class="eyebrow">入港通旗下</span><h1><strong>港言港语</strong> 粤语翻译</h1><p>听得懂 · 说得出 · 更融入香港</p></div>
      <div class="hero-note">让沟通，在香港更简单！</div>

    <div class="statusbar"><div class="status"><span class="pulse" id="pulse"></span><span id="statusText">准备就绪</span></div><span id="supportText">正在检测语音支持…</span></div>
    <div class="stack" aria-label="粤语转普通话工作区">
      <section class="card translator-card">
        <div class="language-row"><div class="lang">粤语 <small>广东话</small></div><div class="swap" aria-hidden="true">⇄</div><div class="target"><span>普通话</span><button class="script-toggle" id="scriptToggleBtn" type="button" aria-label="切换为繁体中文"><span id="simpleMode" class="active">简体</span><span class="slash">/</span><span id="traditionalMode">繁体</span></button></div></div>
        <div class="input-shell"><textarea id="source" aria-label="粤语输入" placeholder="请输入要翻译的内容…" spellcheck="false"></textarea><button class="mic mic-inline" id="micBtn" type="button" aria-label="开始说粤语"><span>●</span><span id="micLabel">开始说粤语</span></button></div>
        <button class="primary" id="translateBtn" type="button">立即翻译</button>
        <div class="opts"><label class="check"><input id="continuous" type="checkbox" checked> 连续聆听</label><label class="check"><input id="autoSpeak" type="checkbox" checked> 自动朗读结果</label><span id="queueState">逐句排队：空闲</span></div>
      </section>
      <section class="card result-card">
        <div class="section-head"><h2 class="section-title">翻译结果</h2><button class="mini" id="clearBtn" type="button">清空</button></div>
        <div class="result-shell"><div id="result" class="result empty" aria-live="polite">翻译结果会实时显示在这里</div></div>
        <div class="actionbar"><button class="primary" id="speakBtn" type="button">▶ 朗读普通话</button><button class="iconbtn textbtn" id="copyBtn" type="button" title="复制文本" aria-label="复制文本">复制文本</button><button class="iconbtn pausebtn" id="stopSpeakBtn" type="button" title="暂停阅读" aria-label="暂停阅读"><span>暂停</span><span>阅读</span></button></div>
      </section>
      <section class="card extras-card">
        <div class="examples-title">常用粤语短句</div>
        <div class="chips"><button class="chip">唔该，呢度点去地铁站？</button><button class="chip">我哋听日再倾啦</button><button class="chip">佢而家返紧工</button></div>
        <div class="note"><b>提示</b><span>语音在浏览器中处理，无需 API 充值。手机请使用 Chrome 或 Edge，并允许麦克风权限。</span></div>
      </section>
    </div>
  </main>
  <div class="mobile-dock" aria-label="手机快捷控制">
    <button class="mic" id="mobileMicBtn" type="button"><span>●</span><span id="mobileMicLabel">开始说粤语</span></button>
    <button class="iconbtn pausebtn" id="mobileStopBtn" type="button" title="暂停阅读" aria-label="暂停阅读"><span>暂停</span><span>阅读</span></button>
  </div>
  <div class="toast" id="toast" role="status"></div>

    function takePendingChunk(force=false){const chars=[...pendingFinal.trimStart()];if(!chars.length)return null;let cut=-1;if(!firstSpeechTriggered){let count=0,threshold=-1;for(let i=0;i<chars.length;i++){if(!/[\s，。！？；、,.!?;]/.test(chars[i]))count++;if(count===11){threshold=i+1;break}}if(threshold<0)return null;for(let i=threshold-1;i>=0;i--){if(/[，。！？；、,.!?;]/.test(chars[i])){cut=i+1;break}}if(cut<0)cut=threshold}else{for(let i=0;i<chars.length;i++){if(/[，。！？；、,.!?;]/.test(chars[i])){cut=i+1;break}}if(cut<0){if(!force)return null;cut=chars.length}}const raw=chars.slice(0,cut).join('').trim();pendingFinal=chars.slice(cut).join('').trimStart();return raw||null}
    function commitChunk(raw){if(!raw)return;firstSpeechTriggered=true;committedSource.push(raw);const translated=translate(raw);committedResult.push(translated);finalText=committedSource.join('\n');source.value=[finalText,pendingFinal].filter(Boolean).join('\n');render([...committedResult,pendingFinal?translate(pendingFinal):''].filter(Boolean).join('\n'));if(translated&&$('#autoSpeak').checked)enqueueSpeech(translated)}
    function commitSentence(force=true){clearTimeout(commitTimer);let raw;while((raw=takePendingChunk(force)))commitChunk(raw)}
    function paintRecognition(){const shown=[...committedSource,pendingFinal,liveInterim].filter(Boolean).join('\n');source.value=shown;render([...committedResult,pendingFinal?translate(pendingFinal):''].filter(Boolean).join('\n'),liveInterim)}
    function promoteLiveInterim(){const text=liveInterim.trim();if(!text)return;appendFinalTranscript(text);liveInterim=''}
    function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>t.classList.remove('show'),1700)}
    function setListening(on){listening=on;[micBtn,mobileMicBtn].forEach(b=>b.classList.toggle('recording',on));pulse.classList.toggle('live',on);micLabel.textContent=mobileMicLabel.textContent=on?'正在听…点击停止':'开始说粤语';statusText.textContent=on?'正在识别粤语':speaking?'正在朗读普通话':'准备就绪'}
    const recognitionMessages={
      'not-allowed':'请允许此网站使用麦克风后再试',
      'service-not-allowed':'当前内置浏览器没有提供语音识别服务，请用手机 Chrome 或 Edge 打开',
      'audio-capture':'没有检测到可用的麦克风',
      'language-not-supported':'当前浏览器不支持粤语识别',
      'network':'语音服务连接失败，请检查网络或改用手机 Chrome、Edge',
      'bad-grammar':'粤语识别服务配置异常'
    };
    function safeRecognitionStart(){if(!recognition||manualStop||!listening||starting)return;starting=true;try{recognition.start()}catch(e){starting=false;if(e.name!=='InvalidStateError'){manualStop=true;setListening(false);toast('无法启动麦克风，请刷新后重试')}}}
    function scheduleRestart(){if(!listening||manualStop||!$('#continuous').checked)return setListening(false);const delay=lastRecognitionError==='network'?Math.min(5000,700*Math.pow(1.7,restartCount)):100;clearTimeout(restartTimer);restartTimer=setTimeout(safeRecognitionStart,delay)}
    if(SpeechRecognition){supportText.textContent='浏览器粤语识别可用';recognition=new SpeechRecognition();recognition.lang='zh-HK';recognition.interimResults=true;recognition.continuous=!/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);recognition.maxAlternatives=1;
      recognition.onstart=()=>{starting=false;statusText.textContent='正在连接麦克风…'};
      recognition.onaudiostart=()=>{supportText.textContent='麦克风已连接';statusText.textContent='正在听粤语…'};
      recognition.onspeechstart=()=>{statusText.textContent='正在识别粤语';restartCount=0;lastRecognitionError=''};
      recognition.onresult=e=>{restartCount=0;lastRecognitionError='';let interim='',gotFinal=false;for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript.trim();if(!t)continue;if(e.results[i].isFinal){appendFinalTranscript(t);gotFinal=true}else interim=joinSpeech(interim,t)}if(interim)liveInterim=novelSpeechSuffix(recognitionBase(),interim);else if(gotFinal)liveInterim='';promoteInitialInterim();commitSentence(false);paintRecognition();clearTimeout(commitTimer);if(pendingFinal&&firstSpeechTriggered)commitTimer=setTimeout(()=>{commitSentence(true);paintRecognition()},650)};
      recognition.onerror=e=>{starting=false;lastRecognitionError=e.error;if(e.error==='aborted'&&manualStop)return;if(e.error==='no-speech'&&listening&&!manualStop){statusText.textContent='还没听到声音，继续聆听…';return}if(e.error==='network'&&listening&&!manualStop&&restartCount<5){restartCount++;statusText.textContent=`语音服务重连中（${restartCount}/5）…`;supportText.textContent='浏览器语音服务暂时断开';return}manualStop=true;clearTimeout(restartTimer);setListening(false);supportText.textContent='浏览器语音识别不可用';toast(recognitionMessages[e.error]||`语音识别失败：${e.error}`)};
      recognition.onend=()=>{starting=false;promoteLiveInterim();commitSentence(firstSpeechTriggered||manualStop);paintRecognition();scheduleRestart()};
    }else{supportText.textContent='此浏览器不支持语音识别';[micBtn,mobileMicBtn].forEach(b=>b.classList.add('unsupported'))}
    function toggleListening(){if(!recognition){toast('请复制网址到手机 Chrome 或 Edge 打开');return}if(listening){manualStop=true;listening=false;starting=false;clearTimeout(restartTimer);try{recognition.stop()}catch(_){}setListening(false);return}const existing=source.value.trim();committedSource=existing?[existing]:[];committedResult=existing?[translate(existing)]:[];pendingFinal='';liveInterim='';firstSpeechTriggered=false;manualStop=false;restartCount=0;lastRecognitionError='';setListening(true);safeRecognitionStart()}micBtn.onclick=toggleListening;mobileMicBtn.onclick=toggleListening;
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&listening&&!manualStop)scheduleRestart()});
    let debounce;source.addEventListener('input',()=>{finalText=source.value;liveInterim='';committedSource=finalText?[finalText]:[];committedResult=finalText?[translate(finalText)]:[];clearTimeout(debounce);debounce=setTimeout(()=>render(source.value),180)});
    function stopSpeech(){speechQueue=[];speaking=false;speechSynthesis.cancel();updateQueue();toast('已停止并清空朗读队列')}$('#translateBtn').onclick=()=>{const t=render(source.value);if(t&&$('#autoSpeak').checked)enqueueSpeech(t)};$('#speakBtn').onclick=()=>speak();$('#stopSpeakBtn').onclick=stopSpeech;$('#mobileStopBtn').onclick=stopSpeech;
    $('#clearBtn').onclick=()=>{source.value='';finalText='';pendingFinal='';liveInterim='';firstSpeechTriggered=false;committedSource=[];committedResult=[];speechQueue=[];speaking=false;render('');speechSynthesis.cancel();updateQueue();source.focus()};
    $('#copyBtn').onclick=async()=>{const t=formatScript(translate(source.value));if(!t)return toast('暂无可复制内容');try{await navigator.clipboard.writeText(t);toast(`已复制${scriptMode==='traditional'?'繁体':'简体'}译文`)}catch(_){toast('复制失败，请手动选择')}};
    scriptToggleBtn.onclick=()=>{scriptMode=scriptMode==='simplified'?'traditional':'simplified';simpleMode.classList.toggle('active',scriptMode==='simplified');traditionalMode.classList.toggle('active',scriptMode==='traditional');scriptToggleBtn.setAttribute('aria-label',scriptMode==='simplified'?'切换为繁体中文':'切换为简体中文');listening?paintRecognition():render(source.value);toast(`已切换为${scriptMode==='traditional'?'繁体':'简体'}中文`)};
    document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{source.value=b.textContent;finalText=source.value;committedSource=[finalText];committedResult=[translate(finalText)];render(source.value)});window.__translatorTest={novelSpeechSuffix,compactSpeech,splitCompactPrefix};document.documentElement.dataset.speechSelfTest=[novelSpeechSuffix('嘉寶商業大廈','嘉寶商業大廈1980年落成')==='1980年落成',novelSpeechSuffix('四百幾尺这个单位正宗大鑊','四百幾尺这个单位正宗大鑊全装修')==='全装修',novelSpeechSuffix('5480','5480')==='',compactSpeech(splitCompactPrefix('嘉寶商業大廈1980年落成',11)[0]).length===11].every(Boolean)?'pass':'fail';document.documentElement.dataset.simplifiedSelfTest=translate('今天介紹嘉寶商業大廈的單位內置分體冷氣，電話號碼')==='今天介绍嘉宝商业大厦的单位内置分体冷气，电话号码'?'pass':'fail';document.documentElement.dataset.traditionalSelfTest=toTraditional('今天介绍嘉宝商业大厦的单位内置分体冷气，电话号码')==='今天介紹嘉寶商業大廈的單位內置分體冷氣，電話號碼'?'pass':'fail';updateQueue();
